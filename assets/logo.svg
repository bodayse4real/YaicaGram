<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108" role="img" aria-label="YaicaGram">
  <title>YaicaGram</title>
  <!--
    Логотип YaicaGram: фирменное яично-жёлтое поле (#FFD54F) и
    бумажный самолётик носом на зрителя.
  -->
  <rect width="108" height="108" rx="24" fill="#FFD54F"/>
  <!-- левое крыло -->
  <path d="M54 29.88 L27.55 67.46 L52.05 59.11 Z" fill="#FFFFFF"/>
  <!-- правое крыло, чуть темнее -->
  <path d="M54 29.88 L80.45 67.46 L55.95 59.11 Z" fill="#EEF3FA"/>
  <!-- корпус: ребро сгиба -->
  <path d="M54 29.88 L52.05 59.11 L54 64.12 L55.95 59.11 Z" fill="#CCD5E9"/>
</svg>
